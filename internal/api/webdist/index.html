<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>模型中转站</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;

      .box {
        max-width: 520px;

        padding: 2px 6px;

  <body>
    <div class="box">
      <h1>面板前端尚未构建</h1>
      <p>
        这是占位页面。请先在 <code>web/</code> 目录执行
        <code>npm install &amp;&amp; npm run build</code>，构建产物会输出到
        <code>internal/api/webdist/</code>，随后重新编译 Go 程序即可。

      <p>对外接口不受影响，可直接使用 <code>/v1/*</code>。</p>
